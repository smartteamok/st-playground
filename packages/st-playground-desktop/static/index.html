<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="google" value="notranslate">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' app: blob: data: ws: wss: http://127.0.0.1:* http://localhost:*; script-src 'self' app: blob: 'unsafe-eval' 'wasm-unsafe-eval' http://127.0.0.1:* http://localhost:*; style-src 'self' app: 'unsafe-inline'; img-src 'self' app: data: blob:; media-src 'self' app: data: blob:; connect-src 'self' app: blob: data: ws: wss: http://127.0.0.1:* http://localhost:*; worker-src 'self' app: blob:; font-src 'self' app: data:; child-src 'self' app: blob:;">
    <title>ST-Playground</title>
    <style>
        html, body, #app {
            margin: 0;
            height: 100%;
            background: #16324F;
        }
        .splash {
            color: #F4B942;
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            font-size: 2rem;
            font-weight: 700;
            margin: 0;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
    </style>
</head>
<body>
    <div id="app"><p class="splash">ST-Playground</p></div>
</body>
</html>
